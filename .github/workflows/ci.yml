name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:all
      - run: node scripts/test-higgsfield-adapter.mjs
      - run: node scripts/test-higgsfield-registry.mjs
      - run: node scripts/test-video-provider-failover.mjs
      - run: node scripts/test-generative-video-runtime.mjs
      - run: node scripts/test-packaging-selection-stability.mjs
      - run: node scripts/test-moss-open-source-phase2.mjs
      - run: npm run pipeline:mock
      - run: npm run web:build
